<!doctype html>
<!-- Source for public/og.png. Serve this directory with ./fonts/*.woff2 and screenshot at 1200×630. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "DLE HQ Lockup"; src: url("fonts/inter-light.woff2") format("woff2"); font-weight: 300; font-style: normal; }
@font-face { font-family: "DLE HQ Lockup"; src: url("fonts/inter-medium.woff2") format("woff2"); font-weight: 500; font-style: normal; }
@font-face { font-family: "DLE HQ Lockup"; src: url("fonts/inter-extrabold.woff2") format("woff2"); font-weight: 800; font-style: normal; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #12161e; }
body {
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(ellipse 72% 62% at 50% 44%, rgba(106,170,100,0.20), rgba(106,170,100,0) 64%),
    #12161e;
  color: #f4f7f5;
}
.stack { display: flex; flex-direction: column; align-items: center; transform: translateY(18px); }
.logo { width: 700px; height: 210px; display: block; }
.tagline {
  margin: 2px 0 0;
  font-family: "DLE HQ Lockup", Inter, sans-serif;
  font-weight: 500;
  font-size: 42px;
  line-height: 1;
  letter-spacing: 0.01em;
  color: #e7eef6;
}
</style></head>
<body><div class="stack">
<svg class="logo" aria-hidden="true" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <g transform="translate(10, 5) scale(0.5)">
    <rect x="22" y="20" width="16" height="16" rx="4" fill="currentColor"/>
    <rect x="22" y="42" width="16" height="16" rx="4" fill="currentColor"/>
    <rect x="22" y="64" width="16" height="16" rx="4" fill="currentColor"/>
    <rect x="44" y="20" width="16" height="16" rx="4" fill="currentColor"/>
    <rect x="44" y="64" width="16" height="16" rx="4" fill="currentColor"/>
    <g transform="rotate(45 64 50)">
      <rect x="56" y="42" width="16" height="16" rx="4" fill="#6AAA64"/>
    </g>
    <circle cx="64" cy="50" r="3" fill="#FAFAFA"/>
  </g>
  
  <text x="68" y="37" font-family="DLE HQ Lockup, Inter, sans-serif" font-size="24" font-weight="300" fill="currentColor" letter-spacing="0.5">DLE</text>
  <text x="120" y="37" font-family="DLE HQ Lockup, Inter, sans-serif" font-size="24" font-weight="800" fill="#6AAA64" letter-spacing="0.5">HQ</text>
  <text x="69" y="49" font-family="DLE HQ Lockup, Inter, sans-serif" font-size="8" font-weight="500" fill="currentColor" opacity="0.45" letter-spacing="2">DAILY GAMES HUB</text>
</svg>
<p class="tagline">Daily Games Like Wordle</p>
</div></body></html>
