<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>2048</title>
<style>html,body{margin:0;height:100%;background:#faf8ef;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center;flex-direction:column}
#top{display:flex;gap:10px;margin-bottom:10px;color:#776e65;font-weight:700}#top span{background:#bbada0;color:#fff;padding:6px 12px;border-radius:6px}button{background:#8f7a66;color:#fff;border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer}
#b{--s:min(88vmin,460px);width:var(--s);height:var(--s);background:#bbada0;border-radius:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--s)*.03);padding:calc(var(--s)*.03);box-sizing:border-box}
.t{border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--s)*.09);background:#cdc1b4;color:#776e65}</style></head>
<body><div id="top"><span id="sc">Score 0</span><span id="bs">Best 0</span><button id="nb">New</button></div><div id="b"></div>
<script>
const C={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
let g,score,best=+localStorage.b2048||0;const B=document.getElementById('b');
function add(){const e=[];g.forEach((v,i)=>!v&&e.push(i));if(e.length)g[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}
function init(){g=Array(16).fill(0);score=0;add();add();draw()}
function draw(){B.innerHTML=g.map(v=>`<div class="t" style="background:${v?C[v]||'#3c3a32':'#cdc1b4'};color:${v>4?'#fff':'#776e65'}">${v||''}</div>`).join('');best=Math.max(best,score);localStorage.b2048=best;sc.textContent='Score '+score;bs.textContent='Best '+best}
function line(a){a=a.filter(v=>v);for(let i=0;i<a.length-1;i++)if(a[i]==a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1)}while(a.length<4)a.push(0);return a}
function move(d){const o=g.join();for(let k=0;k<4;k++){let idx=[0,1,2,3].map(i=>d=='L'?k*4+i:d=='R'?k*4+3-i:d=='U'?i*4+k:(3-i)*4+k);const r=line(idx.map(i=>g[i]));idx.forEach((i,j)=>g[i]=r[j])}
 if(g.join()!=o){add();draw();if(!canMove())setTimeout(()=>alert('Game over! Score '+score),50)}}
function canMove(){if(g.includes(0))return true;for(let i=0;i<16;i++){if(i%4<3&&g[i]==g[i+1])return true;if(i<12&&g[i]==g[i+4])return true}return false}
addEventListener('keydown',e=>{const m={arrowleft:'L',a:'L',arrowright:'R',d:'R',arrowup:'U',w:'U',arrowdown:'D',s:'D'}[e.key.toLowerCase()];if(m){e.preventDefault();move(m)}if(e.key=='r')init()});
let sx,sy;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))});
nb.onclick=init;init();
</script></body></html>
