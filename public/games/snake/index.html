<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Neon Snake</title>
<style>html,body{margin:0;height:100%;background:#0b1026;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}#c{display:block;margin:auto;background:#0f1733}#hud{position:absolute;top:8px;left:12px;font-weight:700}#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.5);font-size:22px;text-align:center;cursor:pointer}</style></head>
<body><canvas id="c"></canvas><div id="hud">Score 0 · Best 0</div><div id="msg"><b style="font-size:36px;color:#39ff9f">NEON SNAKE</b><p>Tap / press Space to start</p></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),hud=document.getElementById('hud'),msg=document.getElementById('msg');
const N=20;let S,cell,snake,dir,nd,food,score,best=+localStorage.snakeBest||0,run=false,t=0,speed;
function size(){S=Math.min(innerWidth,innerHeight)-4;cell=Math.floor(S/N);c.width=c.height=cell*N;c.style.marginTop=((innerHeight-c.height)/2)+'px'}
function reset(){snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir=nd={x:1,y:0};score=0;speed=8;place()}
function place(){do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(s=>s.x==food.x&&s.y==food.y))}
function start(){reset();run=true;msg.style.display='none'}
function over(){run=false;best=Math.max(best,score);localStorage.snakeBest=best;msg.innerHTML='<b style="font-size:32px;color:#ff3e7f">GAME OVER</b><p>Score '+score+'</p><p>Tap / Space to restart</p>';msg.style.display='flex'}
function step(){dir=nd;const h={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};if(snake.some(s=>s.x==h.x&&s.y==h.y))return over();snake.unshift(h);if(h.x==food.x&&h.y==food.y){score++;speed=Math.min(20,8+score/3);place()}else snake.pop()}
function draw(){x.fillStyle='#0f1733';x.fillRect(0,0,c.width,c.height);x.shadowBlur=15;x.shadowColor='#ff3e7f';x.fillStyle='#ff3e7f';x.beginPath();x.arc((food.x+.5)*cell,(food.y+.5)*cell,cell*.35,0,7);x.fill();x.shadowColor='#39ff9f';snake.forEach((s,i)=>{x.fillStyle=i?'#2bd47f':'#39ff9f';x.fillRect(s.x*cell+1,s.y*cell+1,cell-2,cell-2)});x.shadowBlur=0;hud.textContent='Score '+score+' · Best '+Math.max(best,score)}
function loop(ts){requestAnimationFrame(loop);if(run&&ts-t>1000/speed){t=ts;step()}draw()}
function turn(dx,dy){if(dx!==-dir.x||dy!==-dir.y)nd={x:dx,y:dy}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==' '){e.preventDefault();if(!run)start()}
 if(k=='arrowup'||k=='w')turn(0,-1);if(k=='arrowdown'||k=='s')turn(0,1);if(k=='arrowleft'||k=='a')turn(-1,0);if(k=='arrowright'||k=='d')turn(1,0);if(k.startsWith('arrow'))e.preventDefault()});
let sx,sy;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<20&&Math.abs(dy)<20)return;Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))});
msg.onclick=()=>{if(!run)start()};addEventListener('resize',size);size();reset();requestAnimationFrame(loop);
</script></body></html>
